
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiadomość dla Ciebie ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #102a43;
      --blue: #1d4059;
      --blue-light: #315d7a;
      --brown: #4b3025;
      --brown-light: #76513d;
      --cream: #e6d5c3;
      --gold: #d8b49a;
      --white: #ffffff;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      position: relative;

      background:
        radial-gradient(
          circle at top left,
          rgba(120, 160, 190, 0.25),
          transparent 40%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(125, 85, 55, 0.25),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          var(--navy),
          var(--blue) 50%,
          var(--brown)
        );

      background-attachment: fixed;
    }

    /* Dekoracyjne serca w tle */

    body::before,
    body::after {
      content: "♥";
      position: fixed;
      z-index: 0;
      color: rgba(255, 255, 255, 0.06);
      font-size: 180px;
      pointer-events: none;
      user-select: none;
    }

    body::before {
      top: -45px;
      left: -30px;
      transform: rotate(-15deg);
    }

    body::after {
      right: -25px;
      bottom: -65px;
      transform: rotate(15deg);
    }

    /* Główna sekcja */

    .messages-section {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      margin: auto;
      text-align: center;
      animation: fadeIn 1s ease both;
    }

    h1 {
      margin: 0 0 15px;
      color: var(--white);
      font-size: clamp(27px, 5vw, 40px);
      line-height: 1.3;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .messages-subtitle {
      max-width: 470px;
      margin: 0 auto 30px;
      color: var(--cream);
      font-size: 16px;
      line-height: 1.8;
    }

    /* Szklana karta wiadomości */

    .message-card {
      position: relative;
      padding: 35px 25px;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 26px;

      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);

      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.30);
    }

    .message-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(230, 213, 195, 0.65),
        transparent
      );
    }

    /* Serce */

    .message-heart {
      margin-bottom: 20px;
      color: var(--cream);
      font-size: 72px;
      line-height: 1.2;
      filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.2));
      animation: heartbeat 2.2s infinite ease-in-out;
    }

    /* Tekst wiadomości */

    #randomMessage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      margin: 0 0 25px;

      color: var(--white);
      font-size: clamp(18px, 3vw, 21px);
      line-height: 1.9;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .message-change {
      animation: messageAppear 0.6s ease both;
    }

    /* Przycisk */

    .message-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      max-width: 100%;
      padding: 16px 27px;

      color: var(--white);
      font-size: 16px;
      font-weight: bold;
      line-height: 1.5;
      text-align: center;

      background: rgba(49, 93, 122, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);

      cursor: pointer;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .message-button:hover {
      background: #3d7192;
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(20, 60, 90, 0.35);
    }

    .message-button:active {
      transform: scale(0.96);
    }

    .message-button:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 5px;
    }

    /* Licznik wiadomości */

    .message-counter {
      margin: 25px 0 0;
      color: var(--cream);
      font-size: 14px;
      line-height: 1.8;
    }

    /* Link powrotny */

    .back-link {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 16px;

      color: var(--cream);
      font-size: 14px;
      text-decoration: none;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);

      transition:
        color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
    }

    .back-link:hover {
      color: var(--white);
      background: rgba(216, 180, 154, 0.15);
      transform: translateY(-2px);
    }

    /* Unoszące się serca */

    .floating-heart {
      position: fixed;
      bottom: -30px;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      color: var(--cream);
      animation: floatUp 5s linear forwards;
    }

    /* Animacje */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        filter: blur(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.09);
      }
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(0deg);
      }

      15% {
        opacity: 0.65;
      }

      85% {
        opacity: 0.5;
      }

      100% {
        opacity: 0;
        transform: translateY(-110vh) rotate(35deg);
      }
    }

    /* Telefony */

    @media (max-width: 600px) {
      body {
        padding: 18px 10px;
      }

      .messages-subtitle {
        margin-bottom: 24px;
        font-size: 15px;
      }

      .message-card {
        padding: 28px 18px;
        border-radius: 21px;
      }

      .message-heart {
        font-size: 62px;
      }

      #randomMessage {
        min-height: 160px;
        font-size: 18px;
      }

      .message-button {
        padding: 14px 20px;
        font-size: 15px;
      }

      .message-counter {
        font-size: 13px;
      }

      body::before,
      body::after {
        font-size: 120px;
      }
    }

    /* Bardzo wąskie ekrany */

    @media (max-width: 350px) {
      .message-card {
        padding: 24px 14px;
      }

      #randomMessage {
        font-size: 17px;
      }

      .message-button {
        padding: 13px 14px;
        font-size: 14px;
      }
    }

    /* Ograniczenie animacji */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="messages-section">

    <h1>💌 Mała wiadomość dla Ciebie</h1>

    <p class="messages-subtitle">
      Jeśli czasami potrzebujesz przypomnienia,
      jak bardzo jesteś dla mnie ważna ❤️
    </p>

    <div class="message-card">

      <div class="message-heart" id="messageHeart">💗</div>

      <p id="randomMessage" aria-live="polite">

      </p>

      <button id="drawMessage" class="message-button">
        ❤️ Wylosuj wiadomość
      </button>

    </div>

    <a class="back-link" href="main.html">
      ← Wróć do strony głównej
    </a>

  </main>

  <script>
    const loveMessages = [
      "Gdybym miał wybrać jeszcze raz, bez zastanowienia wybrałbym Ciebie. ❤️",

      "Mam nadzieję, że kiedyś będziemy wspominać te chwile i uśmiechać się na myśl o tym, od czego wszystko się zaczęło.",

      "Czasami łapię się na tym, że uśmiecham się do telefonu, bo przypomniałaś mi się Ty.",

      "Nie musisz mieć dobrego dnia, żeby zasługiwać na miłość. Chcę być przy Tobie również w te gorsze.",

      "Gdyby ktoś zapytał mnie o moje ulubione miejsce, chyba odpowiedziałbym, że tam, gdzie jesteś Ty.",

      "Jedną z moich ulubionych rzeczy jest to, że mogę dzielić z Tobą nawet zupełnie zwyczajne chwile.",

      "Chciałbym, żebyś czasem mogła zobaczyć siebie moimi oczami. Może wtedy zrozumiałabyś, dlaczego jesteś dla mnie taka wyjątkowa.",

      "Nie wiem, co przyniesie przyszłość, ale bardzo lubię myśl, że możemy odkrywać ją razem.",

      "Nawet jeśli nie mówię tego codziennie, naprawdę doceniam to, że jesteś częścią mojego życia.",

      "Gdybym mógł zatrzymać jedną chwilę, pewnie byłaby to jedna z tych, w których przytulam Cię i nic więcej nie potrzebuję.",

      "Jesteś osobą, której chcę opowiadać zarówno o wielkich rzeczach, jak i o tym, co zjadłem na obiad.",

      "Nie musisz niczego udowadniać, żeby być dla mnie ważna. Jesteś ważna po prostu dlatego, że jesteś sobą.",

      "Czasem najbardziej brakuje mi nie wielkich randek, ale tych małych momentów, kiedy po prostu jesteś obok.",

      "Chcę poznawać Cię dalej, nawet wtedy, kiedy wydaje mi się, że znam już każdy Twój uśmiech.",

      "Mam nadzieję, że daję Ci choć część tego szczęścia, które Ty dajesz mi.",

      "Jeśli dzisiaj nikt Ci tego nie powiedział: jesteś naprawdę kimś wyjątkowym. I nie mówię tego bez powodu.",

      "Lubię to, że z Tobą mogę być zarówno poważny, jak i kompletnie głupi.",

      "Nie zakochałem się w idealnej osobie. Zakochałem się w Tobie, ze wszystkim, co czyni Cię właśnie Tobą.",

      "Czas spędzony z Tobą zawsze wydaje się krótszy, niż powinien.",

      "Gdyby można było przechowywać szczęście w słoiku, chyba wypełniłbym go naszymi wspólnymi wspomnieniami.",

      "Chcę być osobą, przy której możesz odetchnąć i nie musisz udawać, że wszystko jest dobrze.",

      "Uwielbiam, kiedy opowiadasz mi o czymś, co Cię interesuje, nawet jeśli nie znam się na tym ani trochę.",

      "Nie potrzebuję specjalnej okazji, żeby przypominać Ci, że jesteś dla mnie ważna.",

      "Gdybym dostał możliwość przeżycia jeszcze raz jakiegoś dnia z Tobą, pewnie długo nie potrafiłbym wybrać tylko jednego.",

      "Chciałbym kiedyś spojrzeć wstecz i zobaczyć, ile pięknych rzeczy udało nam się wspólnie przeżyć.",

      "Twoja obecność potrafi zmienić mój dzień, nawet jeśli sama nie zdajesz sobie z tego sprawy.",

      "Lubię nasze rozmowy, ale równie mocno lubię te chwile, kiedy nie musimy nic mówić.",

      "Nie zawsze potrafię idealnie wyrazić to, co czuję, ale nigdy nie chcę, żebyś wątpiła w to, jak wiele dla mnie znaczysz.",

      "Jeśli kiedykolwiek zapomnisz, jak bardzo jesteś kochana, wróć tutaj. Zostawiłem Ci małe przypomnienie. ❤️",

      "A ta wiadomość jest najprostsza ze wszystkich: cieszę się, że jesteś. I gdybym miał wybrać jeszcze raz, nadal byłabyś to Ty. 💗"
    ];

    let availableMessages = [...loveMessages];

    const messageElement =
      document.getElementById("randomMessage");

    const button =
      document.getElementById("drawMessage");

    const counter =
      document.getElementById("messageCounter");

    const heart =
      document.getElementById("messageHeart");

    button.addEventListener("click", () => {

      if (availableMessages.length === 0) {
        availableMessages = [...loveMessages];
      }

      const index = Math.floor(
        Math.random() * availableMessages.length
      );

      const message =
        availableMessages.splice(index, 1)[0];

      messageElement.classList.remove("message-change");

      void messageElement.offsetWidth;

      messageElement.textContent = message;
      messageElement.classList.add("message-change");

      heart.textContent = "💖";
      heart.style.animation = "none";

      void heart.offsetWidth;

      heart.style.animation = "";

      counter.textContent =
        availableMessages.length === 0
          ? "Wszystkie wiadomości już na Ciebie czekały. Wylosuj ponownie 💕"
          : `Pozostało wiadomości: ${availableMessages.length} 💕`;

      createFloatingHeart();
    });

    function createFloatingHeart() {
      const floatingHeart = document.createElement("span");

      floatingHeart.className = "floating-heart";

      const hearts = ["♥", "♡", "♥", "💕", "♡"];

      floatingHeart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

      floatingHeart.style.left =
        Math.random() * 90 + 5 + "vw";

      floatingHeart.style.fontSize =
        Math.random() * 18 + 16 + "px";

      document.body.appendChild(floatingHeart);

      floatingHeart.addEventListener("animationend", () => {
        floatingHeart.remove();
      });
    }
  </script>

</body>
</html>
