
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Na pewno? ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, sans-serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(120, 160, 190, 0.25),
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(125, 85, 55, 0.25),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #102a43,
                    #1d4059 50%,
                    #4b3025
                );

            overflow: hidden;
        }

        body::before,
        body::after {
            content: "♥";
            position: fixed;
            color: rgba(255, 255, 255, 0.08);
            font-size: 180px;
            pointer-events: none;
        }

        body::before {
            top: -50px;
            left: -30px;
            transform: rotate(-15deg);
        }

        body::after {
            bottom: -70px;
            right: -20px;
            transform: rotate(15deg);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 55px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 30px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);
        }

        .subtitle {
            margin-bottom: 15px;

            color: #e6d5c3;

            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 15px;

            color: #ffffff;

            font-size: 46px;
            font-weight: 700;

            text-shadow:
                0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .heart {
            display: inline-block;

            margin: 5px 0 35px;

            color: #d8b49a;

            font-size: 32px;

            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .buttons {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 15px;
        }

        .button {
            display: block;

            border-radius: 14px;

            text-decoration: none;
            font-weight: bold;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .yes {
            width: 220px;

            padding: 22px 45px;

            color: #ffffff;
            background: #315d7a;

            font-size: 22px;

            box-shadow:
                0 10px 25px rgba(20, 60, 90, 0.40);
        }

        .yes:hover {
            background: #3d7192;

            transform: translateY(-5px) scale(1.03);

            box-shadow:
                0 15px 30px rgba(20, 60, 90, 0.50);
        }

        .no {
            width: 100px;

            padding: 10px 20px;

            color: #ffffff;
            background: #76513d;

            font-size: 13px;

            box-shadow:
                0 5px 12px rgba(70, 40, 25, 0.30);
        }

        .no:hover {
            background: #8b614a;

            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {

            .container {
                padding: 45px 25px;
            }

            h1 {
                font-size: 34px;
            }

            .yes {
                width: 190px;

                padding: 20px 30px;

                font-size: 20px;
            }

            .no {
                width: 80px;

                padding: 9px 15px;

                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <p class="subtitle">
            Zastanów się jeszcze raz...
        </p>

        <h1>
            Na pewno? ❤️
        </h1>

        <span class="heart">
            ♥
        </span>

        <div class="buttons">

            <a href="kod.html" class="button yes">
                TAK ❤️
            </a>

            <a href="nie2.html" class="button no">
                NIE
            </a>

        </div>

    </main>

</body>

</html>
